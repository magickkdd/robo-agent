schema_version: "1"
# 换被试，不换冻结：`configs/models/deepseek.yaml` 的**字节**被 v1 预注册哈希
# （preregistration._sampling.declared_sha256），所以新 provider 只能是**新文件**。
# 本文件不在任何 `rules_sha256` 里，改它不动 `23abe58ff333…`；也因此用 `--prereg`
# 强制判分的批次一定会被拒绝（`matrix_mismatch`：模型与 base_url 都不是冻结的那个）。
provider: agnes
api_key_env: LLM_API_KEY   # 只记录变量名；密钥本身只在环境变量/仓库内 .env（SPEC 7）
base_url: https://api.agnes-ai.cn/v1
model: agnes-2.5-flash
# prompt 版本与 deepseek.yaml 逐项相同：换了被试没换题，两次结果至少可比。
prompts:
  goal: s2-goal-v1
  decision: s2-decide-v1
  plan: s2-plan-v1
temperature: 0.2
max_tokens: 1200
timeout_s: 60
max_retries: 2
feedback_depth: 3
# 单价未知就留空：`api_cost_estimate`/`cost_estimate_usd` 保持 null，只报请求数与 tokens
# （SPEC 11.4：不臆造价格）。知道真实单价时写成
# pricing_usd_per_mtok: {input: 0.0, output: 0.0}
# proxy 同 deepseek.yaml：默认 "__direct__" 绕过系统代理直连。
